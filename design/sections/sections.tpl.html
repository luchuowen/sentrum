<title>Sentrum Section Directions</title>
<style>
@font-face{font-family:"Instrument Sans";src:url({{F4}}) format("woff2");font-weight:400}
@font-face{font-family:"Instrument Sans";src:url({{F5}}) format("woff2");font-weight:500}
@font-face{font-family:"Instrument Sans";src:url({{F6}}) format("woff2");font-weight:600}
@font-face{font-family:"JetBrains Mono";src:url({{FM}}) format("woff2");font-weight:500}
:root{--bg:#FFFFFF;--bg2:#F4F5F2;--ink:#0F1B25;--ink2:#3F4A53;--rule:#D3D8D3;--blue:#29A9E1;--blue-ink:#0B6F9E;--night:#0B1620;--lab:#0F1B25;--labfg:#fff;--f:"Instrument Sans",system-ui,sans-serif;--m:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1620;--bg2:#112231;--ink:#F2F5F7;--ink2:#B4C3CE;--rule:#22394B;--blue-ink:#5CC0EC;--night:#060D14;--lab:#29A9E1;--labfg:#04202E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1620;--bg2:#112231;--ink:#F2F5F7;--ink2:#B4C3CE;--rule:#22394B;--blue-ink:#5CC0EC;--night:#060D14;--lab:#29A9E1;--labfg:#04202E;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f);margin:0}
a{color:inherit;text-decoration:none}ul,ol{list-style:none;margin:0;padding:0}
.wrap{max-width:1208px;margin-inline:auto;padding-inline:20px}
.dir{padding-block:56px 72px;border-top:1px solid var(--rule)}.dir:first-child{border-top:0}
.lab{display:inline-flex;gap:10px;align-items:center;background:var(--lab);color:var(--labfg);font:500 12px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;border-radius:3px;margin-bottom:10px}
.note{max-width:62ch;color:var(--ink2);margin:0 0 40px;font-size:15px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:40px;flex-wrap:wrap}
.k{font-weight:500;color:var(--blue-ink);font-size:14px;margin:0}
.hd h2{font-size:clamp(30px,3.6vw,52px);line-height:1.02;letter-spacing:-.03em;font-weight:600;margin:10px 0 0;max-width:24ch;text-wrap:balance}
.more{font-weight:500;border-bottom:1.5px solid var(--ink);padding-bottom:2px;white-space:nowrap}
.n{font:500 12px/1 var(--m);letter-spacing:.08em;color:var(--blue-ink)}
.ch{display:flex;flex-wrap:wrap;gap:6px}.ch li{font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:4px 11px;color:var(--ink2);white-space:nowrap}
.cta{display:inline-flex;align-items:center;background:var(--ink);color:var(--bg);font-weight:500;font-size:15px;padding:13px 22px;border-radius:999px;transition:background .2s,transform .2s}.cta:hover{background:var(--blue);color:#04202E}
[class*="im-"]{background-size:cover;background-position:center;background-color:var(--night)}
{{IMGCSS}}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
/* A — tiles */
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.tl-c{display:block}
.tl-i{display:block;aspect-ratio:3/4;border-radius:2px;filter:saturate(.8) brightness(.92);transition:filter .4s}
.tl-c:hover .tl-i{filter:none}
.tl-t{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:2px solid var(--ink);margin-top:14px}
.tl-t b{font-size:19px;font-weight:600;letter-spacing:-.02em}.tl-t i{font-style:normal;transition:transform .25s}.tl-c:hover .tl-t i{transform:translateX(5px);color:var(--blue-ink)}
@media(max-width:980px){.tl{grid-template-columns:repeat(2,minmax(0,1fr))}.tl li:last-child{grid-column:1/-1}.tl li:last-child .tl-i{aspect-ratio:16/9}}
/* B — hover list */
.hl{position:relative}
.hl ul{border-top:1px solid var(--ink)}
.hl a{display:grid;grid-template-columns:56px minmax(0,1fr) auto 28px;align-items:baseline;gap:20px;padding:clamp(18px,2.4vw,30px) 0;border-bottom:1px solid var(--rule);transition:padding .3s}
.hl b{font-size:clamp(30px,5vw,68px);font-weight:600;letter-spacing:-.035em;line-height:1;transition:color .25s}
.hl em{font-style:normal;color:var(--ink2);font-size:15px}
.hl i{font-style:normal;transition:transform .25s}
.hl ul:hover a:not(:hover) b{color:var(--rule)}.hl ul:hover a:not(:hover) .n{opacity:.4}
.hl a:hover i,.hl a:focus-visible i{transform:translateX(6px);color:var(--blue-ink)}
.hl-p{position:absolute;left:0;top:0;width:min(30vw,360px);aspect-ratio:4/3;border-radius:2px;pointer-events:none;opacity:0;transform:translate3d(0,0,0);transition:opacity .3s;z-index:2;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.hl-p.on{opacity:1}
@media(hover:none),(max-width:760px){.hl-p{display:none}.hl a{grid-template-columns:36px 1fr 24px;row-gap:4px}.hl em{grid-column:2;grid-row:2}.hl i{grid-column:3;grid-row:1}}
/* C — bands */
.bd{display:flex;flex-direction:column;gap:6px}
.bd-r{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr) auto 28px;align-items:center;gap:20px;height:104px;padding-inline:clamp(18px,3vw,36px);border-radius:2px;color:#fff;overflow:hidden;isolation:isolate;transition:height .5s cubic-bezier(.3,.7,.2,1);background-size:cover;background-position:center}
.bd-r::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(11,22,32,.78) 0,rgba(11,22,32,.25) 45%,rgba(11,22,32,0) 75%);transition:opacity .4s}
.bd-r .n{color:#8FA6B6}.bd-r b{font-size:clamp(24px,3vw,36px);font-weight:600;letter-spacing:-.025em}
.bd-r em{font-style:normal;font-size:15px;color:#E1EAF0;opacity:0;transform:translateX(-8px);transition:opacity .35s,transform .35s}
.bd-r i{font-style:normal}
.bd-r:hover,.bd-r:focus-visible{height:208px}.bd-r:hover em,.bd-r:focus-visible em{opacity:1;transform:none}
.bd-r:hover::before{opacity:1}
@media(hover:none),(max-width:760px){.bd-r{grid-template-columns:1fr 24px;height:132px;row-gap:2px;align-content:center}.bd-r .n{display:none}.bd-r em{grid-column:1;opacity:1;transform:none}.bd-r:hover{height:132px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<section class="dir" id="a"><div class="wrap"><span class="lab">A · Tiles</span>{{HEAD}}{{A}}</div></section>
<section class="dir" id="b"><div class="wrap"><span class="lab">B · Hover list</span>{{HEAD}}{{B}}</div></section>
<section class="dir" id="c"><div class="wrap"><span class="lab">C · Bands</span>{{HEAD}}{{C}}</div></section>
<script>
(()=>{const hl=document.querySelector('.hl'),p=hl.querySelector('.hl-p');let x=0,y=0,tx=0,ty=0,raf=0,cls='';
function loop(){x+=(tx-x)*.16;y+=(ty-y)*.16;p.style.transform=`translate3d(${x}px,${y}px,0)`;raf=Math.abs(tx-x)+Math.abs(ty-y)>.5?requestAnimationFrame(loop):0}
hl.addEventListener('pointermove',e=>{const r=hl.getBoundingClientRect();tx=e.clientX-r.left+28;ty=e.clientY-r.top-100;if(!raf)raf=requestAnimationFrame(loop)});
hl.querySelectorAll('a').forEach(a=>{const on=()=>{if(cls)p.classList.remove(cls);cls=a.dataset.im;p.classList.add(cls,'on')};a.addEventListener('pointerenter',on);a.addEventListener('focus',()=>{on();const r=a.getBoundingClientRect(),h=hl.getBoundingClientRect();tx=h.width-p.offsetWidth-80;ty=r.top-h.top-20;x=tx;y=ty;p.style.transform=`translate3d(${x}px,${y}px,0)`});a.addEventListener('blur',()=>p.classList.remove('on'))});
hl.addEventListener('pointerleave',()=>p.classList.remove('on'));
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a');if(a&&a.getAttribute('href')==='#')e.preventDefault()},true)})();
</script>
