    <path d="M430 272h40M500 272h40" class="thin"/>

    <path d="M470 500h90v20" class="thin"/>
  </g>

    <text x="332" y="206" class="lbl">RISER</text>
    <text x="474" y="306" class="lbl">WIFI AP</text>
  </g>
